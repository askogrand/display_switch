# Updated configuration - disconnect switches to HDMI1 so you can see the change
usb_device = "05e3:0626"

# Default LG-specific switching  
on_usb_connect = "LgHdmi2"
on_usb_disconnect = "LgHdmi1"

# Monitor-specific config for your LG ULTRAGEAR
[lg-monitor]
monitor_id = "LG ULTRAGEAR"
on_usb_connect = "LgHdmi2" 
on_usb_disconnect = "LgHdmi1"