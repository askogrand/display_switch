# Example configuration for LG displays
# This demonstrates usage of LG-specific input sources

# USB device to monitor (replace with your actual USB device IDs)
usb_device = "1050:0407"

# Default behavior for non-LG displays
on_usb_connect = "DisplayPort1" 
on_usb_disconnect = "Hdmi1"

# LG-specific monitor configuration
[lg-monitor]
monitor_id = "LG"
# Use LG-specific input sources that work with LG's proprietary DDC implementation
on_usb_connect = "LgDisplayPort1"
on_usb_disconnect = "LgHdmi1"

# Example for different LG model that uses different input numbers  
[lg-monitor-alt]
monitor_id = "32UD99"
on_usb_connect = "LgUsbC3"
on_usb_disconnect = "LgDisplayPort3"

# Standard monitors (non-LG) can still use regular input sources
[standard-monitor] 
monitor_id = "DELL"
on_usb_connect = "DisplayPort2"
on_usb_disconnect = "Hdmi2"